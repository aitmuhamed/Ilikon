services:
  db:
    image: postgres:16-alpine
    container_name: ilikon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ilikon
      POSTGRES_PASSWORD: ilikon_dev_password
      POSTGRES_DB: ilikon
    ports:
      - "5439:5432"
    volumes:
      - ilikon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilikon -d ilikon"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ilikon-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ilikon:ilikon_dev_password@db:5432/ilikon?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-min-32-characters-long}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ilikon_uploads:/app/storage/uploads
    profiles: ["full"]

  # ── Cloudflare Tunnel ──────────────────────────────────────────────────
  # Publishes the app on a Cloudflare hostname (TLS, WAF, DDoS, caching)
  # without opening a single inbound port. The tunnel dials out to
  # Cloudflare, so this works from a laptop, an office network or a VPS with
  # no public IP.
  #
  #   docker compose --profile full --profile tunnel up -d
  #
  # Requires CLOUDFLARE_TUNNEL_TOKEN from:
  #   Cloudflare dashboard → Zero Trust → Networks → Tunnels → Create a tunnel
  # Point the tunnel's public hostname at http://app:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ilikon-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Plain default, not ${VAR:?...}: Compose interpolates every service
      # before it filters by profile, so a required-variable form would break
      # `docker compose up -d db` for anyone not using the tunnel.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    # No depends_on: `app` lives in the `full` profile, and Compose rejects a
    # dependency on a service that the active profile set excludes. cloudflared
    # retries its origin connection on its own, so ordering is not needed.
    profiles: ["tunnel"]

volumes:
  ilikon_pgdata:
  ilikon_uploads:
